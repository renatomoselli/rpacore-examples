[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-resume"
version = "0.1.0"
description = "Checkpoint/resume demo using the RPA Core framework."
requires-python = ">=3.11"
dependencies = [
    "rpacore==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
]
