[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests with mocked browser and network dependencies
    live: Opt-in tests that drive a real browser and public website
    slow: Tests that take longer than usual
    smoke: Quick sanity checks

# Configuration
addopts = -v --tb=short --strict-markers --cov=. --cov-report=term-missing --cov-report=html:coverage_html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
